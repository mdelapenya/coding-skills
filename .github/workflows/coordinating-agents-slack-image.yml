name: coordinating-agents Slack image

# Publishes docker.io/mdelapenya/coordinating-agents-slack from
# skills/coordinating-agents/scripts/slack/Dockerfile when a tag
# coordinating-agents-slack-v<semver> is pushed: tests first, then a CVE scan
# that blocks on critical or high findings, then a multi-arch push with
# provenance and an SBOM. A published version is never overwritten. After it
# runs, pin the digest from the job summary in references/slack.md.
#
# Needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the dockerhub environment,
# which only coordinating-agents-slack-v* tags may deploy to. Docker Hub
# personal tokens cannot be limited to one repository, so the token is a
# Read & Write one with an expiry, reachable only from this job.

on:
  push:
    tags:
      - "coordinating-agents-slack-v*"

permissions:
  contents: read

env:
  IMAGE: docker.io/mdelapenya/coordinating-agents-slack
  CONTEXT: skills/coordinating-agents/scripts/slack

jobs:
  test:
    uses: ./.github/workflows/coordinating-agents-slack.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        run: |
          v=${GITHUB_REF_NAME#coordinating-agents-slack-v}
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $GITHUB_REF_NAME is not coordinating-agents-slack-v<major>.<minor>.<patch>"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.version.outputs.version }} already exists; tag a new version"
            exit 1
          fi

      - name: Build for the scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: true
          tags: coordinating-agents-slack:scan

      - name: Scan for CVEs
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://coordinating-agents-slack:scan
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### $IMAGE:${{ steps.version.outputs.version }}"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pin it in \`skills/coordinating-agents/references/slack.md\`:"
            echo
            echo "\`$IMAGE:${{ steps.version.outputs.version }}@${{ steps.push.outputs.digest }}\`" | sed 's|docker.io/||'
          } >> "$GITHUB_STEP_SUMMARY"
